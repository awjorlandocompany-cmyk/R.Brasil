<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin | R.BRASIL REPASSE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Módulos do Firebase (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ SUBSTITUA COM AS SUAS CHAVES DO PASSO 3 AQUI:
    const firebaseConfig = {
      apiKey: "SUA_API_KEY_AQUI",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "SEU_MESSAGING_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Monitorar estado do login
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminSection').classList.remove('hidden');
        document.getElementById('userInfo').classList.remove('hidden');
        carregarVeiculos();
      } else {
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('adminSection').classList.add('hidden');
        document.getElementById('userInfo').classList.add('hidden');
      }
    });

    // Função de Login
    window.handleLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (error) {
        alert("Erro no login: Verifique seu e-mail e senha.");
      }
    };

    // Função de Sair (Logout)
    window.logout = () => signOut(auth);

    // Função de Salvar Veículo no Firebase
    window.saveCar = async (e) => {
      e.preventDefault();
      const carData = {
        model: document.getElementById('carModel').value,
        year: document.getElementById('carYear').value,
        fipe: document.getElementById('fipePrice').value,
        repasse: document.getElementById('repassePrice').value,
        margin: document.getElementById('marginPercent').value,
        image: document.getElementById('imageUrl').value,
        details: document.getElementById('details').value,
        createdAt: serverTimestamp()
      };

      try {
        await addDoc(collection(db, "veiculos"), carData);
        alert("Veículo cadastrado no banco de dados com sucesso!");
        e.target.reset();
        carregarVeiculos();
      } catch (err) {
        console.error("Erro ao salvar:", err);
        alert("Erro ao cadastrar veículo.");
      }
    };

    // Carregar Veículos do Firebase
    async function carregarVeiculos() {
      const container = document.getElementById('carsList');
      container.innerHTML = '<p class="text-sm text-gray-500">Carregando estoque...</p>';
      
      try {
        const q = query(collection(db, "veiculos"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) {
          container.innerHTML = '<p class="text-sm text-gray-500">Nenhum veículo cadastrado no momento.</p>';
          return;
        }

        container.innerHTML = "";
        querySnapshot.forEach((docSnap) => {
          const car = docSnap.data();
          const id = docSnap.id;
          
          container.innerHTML += `
            <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex gap-4 items-center justify-between">
              <img src="${car.image}" alt="${car.model}" class="w-20 h-20 object-cover rounded-lg">
              <div class="flex-grow">
                <h4 class="font-bold text-sm text-white">${car.model} (${car.year})</h4>
                <p class="text-xs text-yellow-400 font-bold">Repasse: R$ ${car.repasse} <span class="text-gray-500 font-normal">(FIPE: R$ ${car.fipe})</span></p>
                <span class="text-[10px] bg-red-500/20 text-red-400 px-2 py-0.5 rounded border border-red-500/30">${car.margin} Margem</span>
              </div>
              <button onclick="deleteCar('${id}')" class="text-red-500 hover:text-red-400 p-2">
                <i class="fa-solid fa-trash-can text-lg"></i>
              </button>
            </div>
          `;
        });
      } catch (err) {
        console.error("Erro ao carregar:", err);
      }
    }

    // Excluir Veículo do Firebase
    window.deleteCar = async (id) => {
      if (confirm("Deseja realmente apagar este veículo do site?")) {
        try {
          await deleteDoc(doc(db, "veiculos", id));
          carregarVeiculos();
        } catch (err) {
          alert("Erro ao apagar veículo.");
        }
      }
    };
  </script>

  <style>
    body { background: #080808; color: white; font-family: 'Segoe UI', sans-serif; }
    .gold-gradient { background: linear-gradient(180deg, #FFF066, #FFCC00, #D49B00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gold-button { background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); color: #080808; font-weight: 800; }
    .card { background: #111; border: 1px solid rgba(255, 215, 0, .2); border-radius: 14px; }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col justify-between">

  <!-- CABEÇALHO -->
  <header class="max-w-6xl mx-auto w-full flex items-center justify-between border-b border-yellow-500/20 pb-4 mb-8">
    <div class="flex items-center gap-3">
      <img src="./R.Brasil Automotive Logo Banner.png" alt="R.Brasil" class="h-10 object-contain">
      <h1 class="text-xl font-black">Painel <span class="gold-gradient">Administrador</span></h1>
    </div>
    <div id="userInfo" class="hidden flex items-center gap-4">
      <span class="text-xs text-gray-400"><i class="fa-solid fa-user-shield text-yellow-400"></i> Admin Conectado</span>
      <button onclick="logout()" class="text-xs text-red-400 border border-red-500/30 px-3 py-1 rounded hover:bg-red-500/10">Sair</button>
    </div>
  </header>

  <!-- FORMULÁRIO DE LOGIN -->
  <div id="loginSection" class="max-w-md mx-auto w-full card p-8 my-auto">
    <h2 class="text-2xl font-black text-center mb-6">Acesso <span class="gold-gradient">Restrito</span></h2>
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="text-xs font-bold text-gray-400">E-mail do Administrador</label>
        <input type="email" id="loginEmail" required placeholder="seuemail@exemplo.com" class="w-full mt-1 bg-zinc-900 border border-zinc-700 rounded p-3 text-sm focus:border-yellow-400 outline-none">
      </div>
      <div>
        <label class="text-xs font-bold text-gray-400">Senha</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full mt-1 bg-zinc-900 border border-zinc-700 rounded p-3 text-sm focus:border-yellow-400 outline-none">
      </div>
      <button type="submit" class="gold-button w-full py-3 rounded font-black text-sm uppercase mt-4">Entrar no Painel</button>
    </form>
  </div>

  <!-- CONTEÚDO ADMIN -->
  <main id="adminSection" class="hidden max-w-6xl mx-auto w-full space-y-8">
    <div class="card p-6 md:p-8">
      <h2 class="text-xl font-black mb-4"><i class="fa-solid fa-plus-circle text-yellow-400 mr-2"></i> Cadastrar Novo Veículo</h2>
      <form onsubmit="saveCar(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2">
          <label class="text-xs font-bold text-gray-400">Modelo do Veículo</label>
          <input type="text" id="carModel" required placeholder="Ex: Chevrolet Onix LTZ 1.0 Turbo" class="w-full mt-1 bg-zinc-900 border border-zinc-700 rounded p-3 text-sm focus:border-yellow-400 outline-none">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-400">Ano / Modelo</label>
          <input type="text" id="carYear" required placeholder="Ex: 2022/2023" class="w-full mt-1 bg-zinc-900 border border-zinc-700 rounded p-3 text-sm focus:border-yellow-400 outline-none">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-400">Valor Tabela FIPE (R$)</label>
          <input type="text" id="fipePrice" required placeholder="Ex: 78.500" class="w-full mt-1 bg-zinc-900 border border-zinc-700 rounded p-3 text-sm focus:border-yellow-400 outline-none">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-400">Valor de Repasse (R$)</label>
          <input type="text" id="repassePrice" required placeholder="Ex: 64.400" class="w-full mt-1 bg-zinc-900 border border-zinc-700 rounded p-3 text-sm focus:border-yellow-400 outline-none">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-400">Margem (%)</label>
          <input type="text" id="marginPercent" required placeholder="Ex: -18%" class="w-full mt-1 bg-zinc-900 border border-zinc-700 rounded p-3 text-sm focus:border-yellow-400 outline-none">
        </div>
        <div class="md:col-span-3">
          <label class="text-xs font-bold text-gray-400">URL da Foto do Veículo</label>
          <input type="url" id="imageUrl" required placeholder="https://..." class="w-full mt-1 bg-zinc-900 border border-zinc-700 rounded p-3 text-sm focus:border-yellow-400 outline-none">
        </div>
        <div class="md:col-span-3">
          <label class="text-xs font-bold text-gray-400">Detalhes</label>
          <input type="text" id="details" placeholder="Ex: Completo, Automático, Único Dono" class="w-full mt-1 bg-zinc-900 border border-zinc-700 rounded p-3 text-sm focus:border-yellow-400 outline-none">
        </div>
        <div class="md:col-span-3 mt-2">
          <button type="submit" class="gold-button w-full py-4 rounded font-black text-sm uppercase">
            <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Cadastrar no Firebase
          </button>
        </div>
      </form>
    </div>

    <div class="card p-6">
      <h2 class="text-xl font-black mb-4"><i class="fa-solid fa-list text-yellow-400 mr-2"></i> Veículos Cadastrados no Banco</h2>
      <div id="carsList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>
  </main>

  <footer class="text-center text-xs text-gray-600 mt-8">
    © 2026 R.BRASIL — Painel de Controle Administrativo
  </footer>

</body>
</html>
