<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>R.BRASIL | Repasse de Veículos</title>
  <meta name="description" content="R.BRASIL - Rede de oportunidades de repasse de veículos, conectando compradores e vendedores.">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    .gold {
      color: #FFD700;
    }

    .gold-gradient {
      background: linear-gradient(180deg, #FFF066, #FFCC00, #D49B00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gold-border {
      border: 1px solid rgba(255, 215, 0, .35);
    }

    .gold-button {
      background: #FFD700;
      color: #080808;
      font-weight: 800;
      transition: .2s;
    }

    .gold-button:hover {
      background: #ffe766;
      transform: translateY(-2px);
    }

    .card {
      background: #111;
      border: 1px solid rgba(255, 215, 0, .2);
      border-radius: 14px;
    }

    .logo-link {
      display: inline-flex;
      align-items: center;
    }

    .logo-img {
      display: block;
      width: 260px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }

    .payment-card {
      background: linear-gradient(145deg, #171717, #080808);
      border: 1px solid rgba(255, 215, 0, .45);
      border-radius: 18px;
      box-shadow: 0 0 35px rgba(255, 215, 0, .07);
    }

    @media (max-width: 768px) {
      .logo-img {
        width: 190px;
      }
    }
  </style>
</head>

      <a href="#inicio" class="logo-link">
        <img
          src="./R.Brasil Automotive Logo Banner.png"
          alt="R.BRASIL - Repasse de Veículos"
          class="logo-img">
      </a>

      <nav class="flex flex-wrap gap-5 text-sm font-bold">
        <a href="#inicio" class="hover:text-yellow-400">INÍCIO</a>
        <a href="#como-funciona" class="hover:text-yellow-400">COMO FUNCIONA</a>
        <a href="#depoimentos" class="hover:text-yellow-400">DEPOIMENTOS</a>
        <a href="#pagamento" class="hover:text-yellow-400">ACESSAR GRUPOS</a>
        <a href="#anunciar" class="hover:text-yellow-400">ANUNCIAR</a>

      </nav>

  </header>

          Encontre veículos, anuncie oportunidades e amplie sua rede de negócios.
